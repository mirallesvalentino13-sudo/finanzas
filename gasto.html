<div class="f"><label for="acc-p">Contraseña</label><div class="acc-pass"><input id="acc-p" type="password" class="in-text" autocomplete="current-password" required><button type="button" class="acc-ver" aria-controls="acc-p" aria-pressed="false">${ICO_OJO}</button></div></div>
<label class="check"><input type="checkbox" id="acc-r" ${store.get('fin-recordar') ? 'checked' : ''}> Recordarme en este dispositivo (30 días)</label>
<p id="acc-err" class="acc-err" role="alert">${esc(msg)}</p>
<button class="btn primary" type="submit">Ingresar</button>
</form>
<p class="hint acc-pie">Si olvidó su contraseña, pídale al administrador que la restablezca.</p>
</section></div>`
: `<div class="acceso">${accHero(forzado ? 'Elija su contraseña' : 'Cambiar contraseña')}
<section class="panel acc-form" aria-labelledby="acc-h"><h2 id="acc-h">${forzado ? 'Cambie su contraseña temporal' : 'Cambiar contraseña'}</h2>
${forzado ? '<p class="hint">Es la primera vez que entra (o se restableció su contraseña). Elija una propia para continuar.</p>' : ''}
<form id="acc-f" novalidate>
<input type="text" autocomplete="username" value="${esc(u ? u.usuario : '')}" hidden>
<div class="f"><label for="acc-a">Contraseña ${forzado ? 'temporal' : 'actual'}</label><input id="acc-a" type="password" class="in-text" autocomplete="current-password" required></div>
<div class="f"><label for="acc-n">Contraseña nueva</label><div class="acc-pass"><input id="acc-n" type="password" class="in-text" autocomplete="new-password" required aria-describedby="acc-reg"><button type="button" class="acc-ver" aria-controls="acc-n" aria-pressed="false">${ICO_OJO}</button></div>
<p class="hint" id="acc-reg">Al menos 8 caracteres, con letras y números.</p></div>
<div class="f"><label for="acc-n2">Repita la contraseña nueva</label><input id="acc-n2" type="password" class="in-text" autocomplete="new-password" required></div>
<p id="acc-err" class="acc-err" role="alert">${esc(msg)}</p>
<button class="btn primary" type="submit">Guardar contraseña</button>
${forzado ? '<button class="btn small acc-pie" type="button" data-act="salir">Salir</button>' : '<button class="btn small acc-pie" type="button" id="acc-volver">Volver</button>'}
</form>
</section></div>`;
box.querySelectorAll('.acc-ver').forEach(b => b.onclick = () => {
const inp = document.getElementById(b.getAttribute('aria-controls')), ver = inp.type === 'password';
inp.type = ver ? 'text' : 'password'; b.setAttribute('aria-pressed', String(ver)); b.textContent = ver ? 'Ocultar' : 'Mostrar';
});
const volver = box.querySelector('#acc-volver'); if (volver) volver.onclick = ocultarAcceso;
const f = box.querySelector('#acc-f'), err = box.querySelector('#acc-err'), btn = f.querySelector('.btn.primary');
const fallo = (m, campo) => { err.textContent = m; btn.disabled = false; if (campo) campo.focus(); };
f.onsubmit = async ev => {
ev.preventDefault();
if (btn.disabled) return;
err.textContent = '';
if (modo === 'login') {
const us = f.querySelector('#acc-u'), pw = f.querySelector('#acc-p'), rec = f.querySelector('#acc-r').checked;
if (!us.value.trim()) return fallo('Ingrese su usuario.', us);
if (!pw.value) return fallo('Ingrese su contraseña.', pw);
btn.disabled = true; btn.textContent = 'Ingresando…';
try {
const r = await llamar('apiLogin', us.value.trim(), pw.value, rec);
store.set('fin-recordar', rec);
sesionGuardar(r, rec);
entrar();
} catch (e) { btn.textContent = 'Ingresar'; pw.value = ''; fallo(limpiarMsg(e), pw); }
return;
}
const a = f.querySelector('#acc-a'), n = f.querySelector('#acc-n'), n2 = f.querySelector('#acc-n2');
if (!a.value) return fallo('Ingrese su contraseña ' + (forzado ? 'temporal.' : 'actual.'), a);
if (n.value.length < 8 || !/[A-Za-z]/.test(n.value) || !/[0-9]/.test(n.value)) return fallo('La contraseña nueva tiene que tener al menos 8 caracteres, con letras y números.', n);
if (n.value !== n2.value) return fallo('Las dos contraseñas nuevas no coinciden.', n2);
btn.disabled = true;
const rec = !!(sesionLeer() || {}).rec;
try {
const r = await llamar('apiCambiarClave', a.value, n.value, rec);
sesionGuardar(r, rec);
toast('Contraseña cambiada');
entrar();
} catch (e) { fallo(limpiarMsg(e), a); }
};
const first = box.querySelector('input:not([hidden])'); if (first) setTimeout(() => first.focus(), 30);
}
const limpiarMsg = e => String(e && e.message || e).replace(/^(Exception|Error):\s*/, '').replace(/^SESION:\s*/, '');
function ocultarAcceso() {
$('#acceso').hidden = true; $('#acceso').innerHTML = '';
document.documentElement.classList.remove('sin-sesion');
}
function entrar() {
const u = usuarioActual();
if (!u) return mostrarAcceso('login');
if (u.debeCambiar) return mostrarAcceso('cambiar');
ocultarAcceso();
S.data = null; S.usuarios = null; S.view = S.view || 'inicio';
cargarApp();
}
async function cerrarSesion() {
const s = sesionLeer();
if (s) { try { await llamar('apiLogout'); } catch (e) { /* igual se cierra en este dispositivo */ } }
sesionBorrar();
S.data = null; S.usuarios = null;
mostrarAcceso('login', '');
toast('Sesión cerrada');
}
const AVATAR_OK = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function avatarSrc() { const v = S.data ? cfg('avatar') : ''; return v && v.length < 50000 && AVATAR_OK.test(v) ? v : ''; }
function iniciales() {
const u = usuarioActual() || {}, n = String((S.data && cfg('nombre')) || u.nombre || u.usuario || '?').trim();
return n.split(/\s+/).slice(0, 2).map(w => w.charAt(0)).join('').toUpperCase() || '?';
}
function avatarHtml(cls = '') {
const s = avatarSrc();
return s ? `<img class="avatar ${cls}" src="${esc(s)}" alt="">` : `<span class="avatar ini ${cls}" aria-hidden="true">${esc(iniciales())}</span>`;
}
async function subirAvatar(file) {
if (!file || String(file.type).indexOf('image') !== 0) { toast('Elija una imagen (JPG o PNG).'); return; }
let url;
try {
url = URL.createObjectURL(file);
const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
const L = 160, c = document.createElement('canvas'); c.width = c.height = L;
const lado = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, L, L); g.drawImage(img, sx, sy, lado, lado, 0, 0, L, L);
let q = .85, data = c.toDataURL('image/jpeg', q);
while (data.length > 40000 && q > .4) { q -= .15; data = c.toDataURL('image/jpeg', q); }
if (!AVATAR_OK.test(data)) throw new Error('formato');
save('Config', { id: 'avatar', valor: data }, 'Foto de perfil guardada');
} catch (e) { toast('No se pudo leer la imagen. Pruebe con otra foto.'); }
finally { if (url) URL.revokeObjectURL(url); }
}
function pintarMarcaSide() {
const brand = document.querySelector('.side .brand'); if (!brand) return;
const src = avatarSrc(); let b = brand.querySelector('.side-av');
if (!src) { if (b) b.remove(); brand.classList.remove('con-foto'); return; }
if (!b) { b = document.createElement('button'); b.type = 'button'; b.className = 'side-av'; b.dataset.act = 'perfil'; b.setAttribute('aria-label', 'Su cuenta y foto de perfil'); b.title = 'Su cuenta'; brand.prepend(b); }
const firma = src.length + src.slice(-24);
if (b.dataset.firma !== firma) { b.innerHTML = avatarHtml(); b.dataset.firma = firma; }
brand.classList.add('con-foto');
}
document.addEventListener('change', e => {
const inp = e.target.closest && e.target.closest('input[data-avatar]');
if (inp && inp.files && inp.files[0]) { subirAvatar(inp.files[0]); inp.value = ''; }
});
function panelCuenta() {
const u = usuarioActual(); if (!u) return '';
return `<section class="panel">
<div class="ph"><h2>Su cuenta</h2><span class="meta">${esc(u.usuario)} · ${u.rol === 'admin' ? 'administrador' : 'usuario'}</span></div>
<div class="perfil" id="perfil">${avatarHtml('xl')}
<div><span class="lbl">Foto de perfil</span>
<p class="hint" style="margin:2px 0 10px">Se recorta al cuadrado y se guarda reducida, solo para su usuario.${avatarSrc() ? '' : ' Sin foto se muestran sus iniciales.'}</p>
<div class="perfil-acts"><label class="btn small">${avatarSrc() ? 'Cambiar foto' : 'Subir foto'}<input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" data-avatar hidden></label>
${avatarSrc() ? '<button class="btn small" data-act="avatar-quitar">Quitar foto</button>' : ''}</div></div>
</div>
<div class="cfg-grid">
<div class="f"><span class="lbl">Contraseña</span><button class="btn small" data-act="cambiar-clave">Cambiar contraseña</button></div>
<div class="f"><span class="lbl">Sesión</span><button class="btn small" data-act="salir">Cerrar sesión en este dispositivo</button></div>
</div>
</section>`;
}
function panelUsuarios() {
const u = usuarioActual(); if (!u || u.rol !== 'admin') return '';
if (!S.usuarios) {
if (!S.cargandoUsuarios) {
S.cargandoUsuarios = true;
llamar('apiUsuarios').then(l => { S.usuarios = l; }).catch(e => toast('No se pudieron cargar los usuarios: ' + limpiarMsg(e))).finally(() => { S.cargandoUsuarios = false; if (S.usuarios) render(); });
}
return `<section class="panel"><div class="ph"><h2>Usuarios</h2></div><div class="skel" style="height:64px;margin-top:12px"></div></section>`;
}
return `<section class="panel">
<div class="ph"><h2>Usuarios</h2><span class="meta">Cada usuario ve solo sus propias finanzas</span></div>
<div class="usr-lista">${S.usuarios.map(x => `<div class="usr">
<span class="rbody"><span class="rtitle">${esc(x.nombre || x.usuario)}${x.id === u.id ? ' (usted)' : ''}</span>
<span class="rsub">${esc(x.usuario)}${x.email ? ' · ' + esc(x.email) : ''} · ${x.ultimoLogin ? 'último ingreso ' + esc(x.ultimoLogin) : 'nunca ingresó'}</span></span>
<span class="tag">${x.rol === 'admin' ? 'Administrador' : 'Usuario'}</span>
${x.activo ? '' : '<span class="tag off">Desactivado</span>'}${x.debeCambiar && x.activo ? '<span class="tag off">Contraseña temporal</span>' : ''}
<span class="acts"><button class="btn small" data-act="usr-edit" data-id="${esc(x.id)}">Editar</button><button class="btn small" data-act="usr-reset" data-id="${esc(x.id)}">Restablecer contraseña</button></span>
</div>`).join('')}</div>
<div class="actions" style="max-width:340px"><button class="btn primary" data-act="usr-nuevo">Agregar usuario</button></div>
</section>`;
}
function mostrarClaveTemporal(x, clave) {
openSheet(`Contraseña temporal de ${x.usuario}`, body => {
body.innerHTML = `<p class="hint" style="margin-top:0">Pásele esta contraseña a <b>${esc(x.nombre || x.usuario)}</b>. Solo se muestra ahora; al entrar, la app le va a pedir que la cambie.</p>
<div class="f"><span class="lbl">Usuario</span><div class="clave-temp">${esc(x.usuario)}</div></div>
<div class="f"><span class="lbl">Contraseña temporal</span><div class="clave-temp">${esc(clave)}</div></div>
<div class="actions"><button class="btn primary" type="button" id="ct-copiar">Copiar usuario y contraseña</button></div>`;
body.querySelector('#ct-copiar').onclick = async () => {
try { await navigator.clipboard.writeText(`Usuario: ${x.usuario}\nContraseña temporal: ${clave}`); toast('Copiado'); } catch (e) { toast('No se pudo copiar: selecciónela a mano'); }
};
});
}
function openUsuario(id) {
const x = id ? (S.usuarios || []).find(y => y.id === id) : null, yo = usuarioActual();
const F = { usuario: x ? x.usuario : '', nombre: x ? x.nombre : '', email: x ? x.email : '', rol: x ? x.rol : 'usuario', activo: x ? x.activo : true };
openSheet(x ? `Editar ${x.usuario}` : 'Agregar usuario', body => {
const draw = () => {
body.innerHTML = `
${x ? '' : `<div class="f"><label for="u-usr">Usuario (para ingresar)</label><input id="u-usr" class="in-text" data-f="usuario" autocapitalize="none" spellcheck="false" value="${esc(F.usuario)}" placeholder="ej: maria.p"></div>`}
<div class="f"><label for="u-nom">Nombre</label><input id="u-nom" class="in-text" data-f="nombre" value="${esc(F.nombre)}"></div>
<div class="f"><label for="u-mail">Email (para los avisos por mail)</label><input id="u-mail" class="in-text" type="email" data-f="email" value="${esc(F.email)}"></div>
<div class="f"><span class="lbl">Rol</span>${seg('rol', [{ v: 'usuario', html: 'Usuario' }, { v: 'admin', html: 'Administrador' }], F.rol)}</div>
${x ? `<div class="f"><label class="check"><input type="checkbox" data-f="activo" ${F.activo ? 'checked' : ''} ${x.id === yo.id ? 'disabled' : ''}> Activo (puede ingresar)</label>
<p class="hint" style="margin-top:4px">Desactivar corta sus sesiones y no borra sus datos.</p></div>` : '<p class="hint">Se genera una contraseña temporal que va a ver una sola vez.</p>'}
<div class="actions"><button class="btn primary" type="button" id="u-ok">${x ? 'Guardar' : 'Crear usuario'}</button>
${x && x.id !== yo.id ? '<button class="btn small" type="button" id="u-del">Borrar usuario</button>' : ''}</div>`;
bindForm(body, F, draw);
body.querySelector('#u-ok').onclick = async ev => {
const b = ev.currentTarget; if (b.disabled) return; b.disabled = true;
try {
if (x) {
const r = await llamar('apiUsuarioActualizar', { id: x.id, nombre: F.nombre, email: F.email, rol: F.rol, activo: F.activo });
S.usuarios = S.usuarios.map(y => y.id === r.id ? r : y); closeSheet(); render(); toast('Usuario guardado');
} else {
const r = await llamar('apiUsuarioCrear', { usuario: F.usuario, nombre: F.nombre, email: F.email, rol: F.rol });
S.usuarios = [...(S.usuarios || []), r.usuario]; render(); mostrarClaveTemporal(r.usuario, r.claveTemporal);
}
} catch (e) { b.disabled = false; toast(limpiarMsg(e)); }
};
const del = body.querySelector('#u-del');
if (del) del.onclick = async () => {
if (!dobleToque(del, `Toque de nuevo para borrar a "${x.usuario}"`)) return;
try { await llamar('apiUsuarioBorrar', x.id); S.usuarios = S.usuarios.filter(y => y.id !== x.id); closeSheet(); render(); toast('Usuario borrado'); }
catch (e) { toast(limpiarMsg(e)); }
};
};
draw();
});
}
async function resetearUsuario(id) {
const x = (S.usuarios || []).find(y => y.id === id); if (!x) return;
try {
const r = await llamar('apiUsuarioResetear', id);
S.usuarios = S.usuarios.map(y => y.id === r.usuario.id ? r.usuario : y);
render(); mostrarClaveTemporal(r.usuario, r.claveTemporal);
} catch (e) { toast(limpiarMsg(e)); }
}
(function iniciar() {
if (sesionLeer()) entrar(); else mostrarAcceso('login');
})();
window.__arranque.paso = 'listo';
</script>
